

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>{=$title}</title>
  <meta
    name="description"
    content="{=$description}"
  />
  <meta
    name="keywords"
    content="{=$keywords}"
  />
  <link
    rel="canonical"
    href="{=$site-url}"
  />

  <meta
    property="og:type"
    content="website"
  />
  <meta
    property="og:url"
    content="{=$site-url}"
  />
  <meta
    property="og:title"
    content="{=$title}"
  />
  <meta
    property="og:description"
    content="{=$description}"
  />
  <meta
    property="og:image"
    content="{=$site-url}{=$og-image}"
  />

  <meta
    property="twitter:card"
    content="summary_large_image"
  />
  <meta
    property="twitter:url"
    content="{=$site-url}"
  />
  <meta
    property="twitter:title"
    content="{=$title}"
  />
  <meta
    property="twitter:description"
    content="{=$description}"
  />
  <meta
    property="twitter:image"
    content="{=$site-url}{=$og-image}"
  />

  <meta
    name="theme-color"
    content="{=$theme-color}"
  />

  <link
    rel="icon"
    type="image/svg+xml"
    href="favicon.svg"
  />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://jessica-trainer.com/#person",
          "name": "Jessica Tailor",
          "jobTitle": "Personal Fitness Trainer",
          "url": "https://jessica-trainer.com/",
          "image": "https://jessica-trainer.com/img/og-preview.webp",
          "sameAs": [
            "https://instagram.com/jessica_trainer",
            "https://twitter.com/jessica_trainer",
            "https://facebook.com/jessica_trainer"
          ]
        },
        {
          "@type": "LocalBusiness",
          "@id": "https://jessica-trainer.com/#business",
          "name": "Jessica Tailor Personal Training",
          "url": "https://jessica-trainer.com/",
          "image": "https://jessica-trainer.com/img/og-preview.webp",
          "priceRange": "$$",
          "description": "Professional personal training, HIIT workouts, strength exercises, and custom nutrition plans.",
          "founder": {
            "@id": "https://jessica-trainer.com/#person"
          }
        }
      ]
    }
  </script>
</head>
