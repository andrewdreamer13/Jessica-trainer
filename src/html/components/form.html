<form
  class="form {=$class}"
  id="{=$id}"
  action="https://api.web3forms.com/submit"
  method="POST"
  novalidate
  data-country="gb"
  data-modal-success="modal-success"
>
  <input
    type="hidden"
    name="access_key"
    value="0d0b7a66-56f9-4ab4-a8f9-a92b96d45986"
  />
  <input
    type="checkbox"
    name="botcheck"
    hidden
  />

  <div class="form__input-box">
    <label
      class="form__label"
      for="name"
    >
      Full name
    </label>

    <input
      class="form__input"
      id="name"
      type="text"
      name="name"
      placeholder="full name"
      required
      autocomplete="name"
      aria-describedby="name-error"
    />

    <span
      class="form__error"
      id="name-error"
    ></span>
  </div>

  <div class="form__input-box">
    <label
      class="form__label"
      for="email"
    >
      Email
    </label>

    <input
      class="form__input"
      id="email"
      type="email"
      name="email"
      placeholder="email"
      required
      autocomplete="email"
      aria-describedby="email-error"
    />

    <span
      class="form__error"
      id="email-error"
    ></span>
  </div>

  <div class="form__input-box">
    <label
      class="form__label"
      for="phone"
    >
      Phone
    </label>

    <input
      class="form__input"
      id="phone"
      type="tel"
      name="phone"
      placeholder="phone"
      required
      autocomplete="tel"
      aria-describedby="phone-error"
    />

    <span
      class="form__error"
      id="phone-error"
    ></span>
  </div>

  <div class="form__textarea-box">
    <label
      class="form__label"
      for="message"
    >
      Message
    </label>

    <textarea
      class="form__textarea"
      id="message"
      name="message"
      rows="4"
      placeholder="message"
      aria-describedby="message-error"
    ></textarea>

    <span
      class="form__error"
      id="message-error"
    ></span>
  </div>

  <button
    class="form__submit button"
    type="submit"
  >
    Submit
  </button>
</form>
